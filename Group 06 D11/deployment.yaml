apiVersion: apps/v1
kind: Deployment
metadata:
  name: manufacturing-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: manufacturing
  template:
    metadata:
      labels:
        app: manufacturing
    spec:
      containers:
      - name: manufacturing-container
        image: aaditibhale/manufacturing-app:v2
        ports:
        - containerPort: 5000

        env:
        - name: APP_VERSION
          value: "v2"

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 20
